name: caddy-bgp-lab

x-router: &router
  image: ${FRR_IMAGE:-quay.io/frrouting/frr:10.5.3}
  cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
  sysctls:
    net.ipv4.ip_forward: 1
    net.ipv6.conf.all.disable_ipv6: 0
    net.ipv6.conf.all.forwarding: 1
    net.ipv4.fib_multipath_hash_policy: 1
    net.ipv6.fib_multipath_hash_policy: 1
    net.ipv4.conf.all.rp_filter: 0
    net.ipv4.conf.all.send_redirects: 0
    net.ipv4.conf.default.send_redirects: 0

x-balancer: &balancer
  image: caddy:2.11.9
  init: true
  entrypoint: [tail, -f, /dev/null]
  sysctls:
    net.ipv6.conf.all.disable_ipv6: 0
    net.ipv4.conf.all.rp_filter: 0

services:
  rt1:
    <<: *router
    volumes:
      - ./frr/daemons:/etc/frr/daemons:ro
      - ./frr/vtysh.conf:/etc/frr/vtysh.conf:ro
      - ./frr/rt1.conf:/etc/frr/frr.conf:ro
    networks:
      lan: {ipv4_address: 192.0.2.1, ipv6_address: "2001:db8:1::1"}

  rt2:
    <<: *router
    volumes:
      - ./frr/daemons:/etc/frr/daemons:ro
      - ./frr/vtysh.conf:/etc/frr/vtysh.conf:ro
      - ./frr/rt2.conf:/etc/frr/frr.conf:ro
    networks:
      lan: {ipv4_address: 192.0.2.2, ipv6_address: "2001:db8:1::2"}

  lb1:
    <<: *balancer
    hostname: lb1
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_BIND_SERVICE, KILL]
    environment:
      NODE_IPV4: 192.0.2.11
      NODE_IPV6: "2001:db8:1::11"
      BGP_INTERFACE: "interface cbgp0"
    volumes: &volumes
      - ./bin/caddy:/usr/bin/caddy:ro
      - ./caddy:/etc/caddy:ro
    networks:
      lan: {ipv4_address: 192.0.2.11, ipv6_address: "2001:db8:1::11"}

  lb2:
    <<: *balancer
    hostname: lb2
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, KILL]
    environment:
      NODE_IPV4: 192.0.2.12
      NODE_IPV6: "2001:db8:1::12"
      BGP_INTERFACE: ""
    volumes: *volumes
    networks:
      lan: {ipv4_address: 192.0.2.12, ipv6_address: "2001:db8:1::12"}

  client:
    image: caddy:2.11.9
    init: true
    entrypoint: [tail, -f, /dev/null]
    cap_add: [NET_ADMIN]
    networks:
      lan: {ipv4_address: 192.0.2.50, ipv6_address: "2001:db8:1::50"}

networks:
  lan:
    enable_ipv6: true
    ipam:
      config:
        - {subnet: 192.0.2.0/24, gateway: 192.0.2.254}
        - {subnet: "2001:db8:1::/64", gateway: "2001:db8:1::ffff"}
