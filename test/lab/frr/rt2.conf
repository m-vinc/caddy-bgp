frr defaults traditional
hostname rt2
log stdout informational
!
router bgp 64503
 bgp router-id 192.0.2.2
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp network import-check
 timers bgp 3 9
 neighbor 192.0.2.11 remote-as 65000
 neighbor 2001:db8:1::11 remote-as 65000
 neighbor 192.0.2.11 timers 3 9
 neighbor 192.0.2.11 bfd 3 300 300
 neighbor 192.0.2.12 remote-as 65000
 neighbor 2001:db8:1::12 remote-as 65000
 neighbor 192.0.2.12 timers 3 9
 neighbor 192.0.2.12 bfd 3 300 300
 !
 address-family ipv4 unicast
  network 0.0.0.0/0
  network 203.0.113.0/24
  maximum-paths 8
  no neighbor 2001:db8:1::11 activate
  no neighbor 2001:db8:1::12 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network ::/0
  network 2001:db8:dead::/48
  maximum-paths 8
  neighbor 2001:db8:1::11 activate
  neighbor 2001:db8:1::12 activate
 exit-address-family
exit
